[project]
name = "morning-brief"
version = "0.1.0"
description = "아침 경제 브리핑 — 시세·뉴스 수집, GPT 요약, MongoDB 적재, API·웹 푸시"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10,<4",
  "fastapi>=0.115",
  "feedparser>=6",
  "openai>=2",
  "pymongo>=4.10",
  "pywebpush>=2",
  "requests>=2.32",
  "uvicorn[standard]>=0.30",
  "yfinance>=0.2.50",
]

[project.scripts]
morning-brief = "morning_brief.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "mongomock>=4.2",
  "pytest>=8",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/morning_brief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # 줄 길이는 ruff format 에 맡긴다 (한국어 문자열은 나누지 않는다)

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의존성 주입 관용구
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]
