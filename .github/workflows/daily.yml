name: 아침 경제 브리핑

on:
  schedule:
    # GitHub 예약 실행은 수십 분 늦게 시작될 때가 있어서 9시보다 30분 일찍 돌린다.
    # 08:30 KST = 23:30 UTC (전날). 일~목 UTC = 월~금 KST.
    - cron: "30 23 * * 0-4"
  workflow_dispatch: {} # Actions 탭에서 "Run workflow"로 바로 실행

permissions:
  contents: write # reports/ 폴더를 저장소에 커밋하기 위해

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 브리핑 생성 및 Notion 게시
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python main.py

      - name: 보고서 기록 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "브리핑 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
